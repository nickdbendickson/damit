name: engine_parity

# DamIT's engine, breach equations and Finder are ports of the DamSafety plugins (nickdbendickson/DWR_Plugins).
# Boann (the flood engine + terrain conditioner) is not a port but a byte-identical vendored copy at damit_runner/boann,
# pinned to DWR_Plugins' DamSafety_Core/boann by damit_runner/BOANN.lock (DamIT Runner 0.11.0); the boann-* jobs check it.
# scripts/check_engine_parity.py compares every ported file with its original (damit_runner/PARITY.json holds the
# accepted differences).
#   pull request / push: against the DamSafety commit PARITY.json was recorded at, so an edit to a ported file
#                        has to be acknowledged (re-record with --update);
#   daily:               against DamSafety's main, so a DamSafety fix that was not ported shows up within a day.

on:
  push:
    branches: [main]
    paths: ["damit_runner/**", "damit_finder/**", "scripts/check_engine_parity.py", "tests/test_engine_parity.py",
            "scripts/boann_sync.py", ".github/workflows/engine_parity.yml"]
  pull_request:
    paths: ["damit_runner/**", "damit_finder/**", "scripts/check_engine_parity.py", "tests/test_engine_parity.py",
            "scripts/boann_sync.py", ".github/workflows/engine_parity.yml"]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorded:
    name: Ported files match the recorded DamSafety commit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The gate's own tests
        run: python3 -m unittest -v tests.test_engine_parity
      - name: Recorded DamSafety commit
        id: rec
        run: echo "sha=$(python3 scripts/check_engine_parity.py --dwr . --print-synced-to)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: nickdbendickson/DWR_Plugins
          ref: ${{ steps.rec.outputs.sha }}
          path: _dwr
      - name: Parity with the recorded commit
        run: python3 scripts/check_engine_parity.py --dwr _dwr

  damsafety-main:
    name: Ported files match DamSafety main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: nickdbendickson/DWR_Plugins
          path: _dwr
      - name: Parity with DamSafety main (a failure lists the files to port)
        run: python3 scripts/check_engine_parity.py --dwr _dwr

  boann-lock:
    name: Vendored Boann matches BOANN.lock and DWR_Plugins at the locked commit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendored files match the lock (no DWR needed)
        run: python3 scripts/boann_sync.py --check
      - name: Locked DWR_Plugins commit
        id: lock
        run: echo "sha=$(python3 scripts/boann_sync.py --print-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: nickdbendickson/DWR_Plugins
          ref: ${{ steps.lock.outputs.sha }}
          path: _dwr
      - name: The lock is DamSafety_Core/boann at that commit
        run: python3 scripts/boann_sync.py --check --dwr _dwr

  boann-behind:
    name: Vendored Boann is DamSafety main's (a failure means a sync PR is due)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: nickdbendickson/DWR_Plugins
          path: _dwr
      - name: Compare with DWR main (sync with scripts/boann_sync.py --dwr <checkout at the merged SHA>)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import boann_sync as B
          lock = B.load_lock()
          main = B.files("_dwr/" + B.SOURCE_REL)
          changed = sorted(k for k in set(main) | set(lock["files"]) if main.get(k) != lock["files"].get(k))
          print("locked: Boann {} at {}".format(lock["boann_version"], lock["commit"]))
          print("DWR main: Boann {}".format(B.boann_version("_dwr/" + B.SOURCE_REL)))
          for k in changed:
              print("  differs on main:", k)
          sys.exit(1 if changed else 0)
          PY
